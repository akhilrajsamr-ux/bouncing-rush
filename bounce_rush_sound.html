<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#090b14" />
<title>Bounce Rush</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#090b14;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
  body{display:grid;place-items:center;color:#fff}
  #wrap{position:relative;width:min(100vw,520px);height:100dvh;min-height:100vh;max-height:1000px;background:linear-gradient(#0e1230,#171b45 55%,#0b0f22);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
  .pill{background:rgba(8,11,25,.58);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;opacity:.65}
  .value{font-size:24px;font-weight:800;line-height:1.05}
  #bestBox{text-align:right}
  #soundBtn{pointer-events:auto;width:46px;height:46px;border-radius:16px;padding:0;display:grid;place-items:center;font-size:21px;color:#fff;background:rgba(8,11,25,.58);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(rgba(8,9,20,.22),rgba(8,9,20,.72));padding:28px;padding-top:calc(28px + env(safe-area-inset-top));padding-bottom:calc(28px + env(safe-area-inset-bottom));pointer-events:auto}
  .card{width:min(92%,390px);text-align:center;padding:30px 24px;border-radius:28px;background:rgba(12,15,33,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:0 26px 80px rgba(0,0,0,.45)}
  h1{font-size:46px;line-height:.9;margin:0 0 12px;font-weight:1000;letter-spacing:-.05em}
  .accent{background:linear-gradient(90deg,#6cf5ff,#a27cff,#ff62c7);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{opacity:.78;line-height:1.55;margin:10px auto 22px;max-width:310px}
  button{border:0;border-radius:16px;padding:14px 24px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#6cf5ff,#9c7cff);color:#090b14;box-shadow:0 12px 34px rgba(108,245,255,.22)}
  .hint{font-size:12px;opacity:.55;margin-top:14px}
  #gameOver{display:none}
  #start{display:grid}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="top">
      <div class="pill"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <button id="soundBtn" aria-label="Toggle sound">🔊</button>
      <div class="pill" id="bestBox"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="overlay" id="start">
    
    <div class="card">
      <h1>BOUNCE<br><span class="accent">RUSH</span></h1>
      <p>Bounce from platform to platform. Move left and right, climb higher, and survive as the rush gets faster.</p>
      <button id="startBtn">START GAME</button>
      <div class="hint">Drag left/right on mobile • A/D or ←/→ on PC</div>
    </div>
  </div>
  <div class="overlay" id="gameOver">
    <div class="card">
      <div class="label">Run over</div>
      <h1 style="font-size:40px;margin-top:8px">SCORE <span class="accent" id="finalScore">0</span></h1>
      <p id="resultText">One more bounce?</p>
      <button id="restartBtn">PLAY AGAIN</button>
      <div class="hint">Tap Play Again • Space / Enter on PC</div>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startScreen=document.getElementById('start'),overScreen=document.getElementById('gameOver');
  const finalScoreEl=document.getElementById('finalScore'),resultText=document.getElementById('resultText'),soundBtn=document.getElementById('soundBtn');

  let W=0,H=0,dpr=1,running=false,last=0,time=0,score=0,cameraY=0,lastMilestone=0;
  let best=Number(localStorage.getItem('bounceRushBest')||0); bestEl.textContent=best;
  let soundEnabled=localStorage.getItem('bounceRushSound')!=='off';
  let audioCtx=null;

  const input={left:false,right:false,pointer:false,px:0};
  const player={x:0,y:0,vx:0,vy:0,r:16};
  let platforms=[],particles=[],stars=[];

  function updateSoundButton(){soundBtn.textContent=soundEnabled?'🔊':'🔇';soundBtn.setAttribute('aria-label',soundEnabled?'Mute sound':'Enable sound')}
  updateSoundButton();

  function ensureAudio(){
    if(!soundEnabled)return null;
    if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function tone(freq=440,duration=.08,type='sine',volume=.06,slideTo=null,delay=0){
    const ac=ensureAudio(); if(!ac)return;
    const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo),t+duration);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.02);
  }
  const sfx={
    start(){tone(330,.09,'triangle',.06,520);tone(520,.12,'triangle',.05,780,.08)},
    bounce(){tone(230,.065,'sine',.045,420);tone(660,.035,'sine',.018,760,.025)},
    milestone(){tone(520,.08,'triangle',.045,660);tone(660,.08,'triangle',.045,820,.07);tone(820,.12,'triangle',.05,1050,.14)},
    gameOver(){tone(300,.15,'sawtooth',.035,210);tone(210,.22,'triangle',.04,105,.13)},
    newBest(){tone(440,.08,'triangle',.045,660);tone(660,.09,'triangle',.05,880,.07);tone(880,.18,'sine',.055,1320,.15)}
  };

  soundBtn.addEventListener('pointerdown',e=>{e.stopPropagation()});
  soundBtn.addEventListener('click',e=>{e.stopPropagation();soundEnabled=!soundEnabled;localStorage.setItem('bounceRushSound',soundEnabled?'on':'off');updateSoundButton();if(soundEnabled){ensureAudio();tone(620,.07,'sine',.035,820)}});

  function resize(){const r=wrap.getBoundingClientRect();W=Math.max(320,r.width);H=Math.max(520,r.height);dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);makeStars()}
  function makeStars(){stars=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,a:Math.random()*.55+.18}))}
  function reset(){score=0;cameraY=0;time=0;lastMilestone=0;scoreEl.textContent='0';particles=[];platforms=[];player.x=W/2;player.y=H-150;player.vx=0;player.vy=-620;player.r=16;platforms.push({x:W/2-70,y:H-80,w:140,h:14,phase:0,move:0});let y=H-170;for(let i=0;i<14;i++){const w=78+Math.random()*52,x=24+Math.random()*(W-w-48);platforms.push({x,y,w,h:12,phase:Math.random()*6.28,move:i>5&&Math.random()<.32?25+Math.random()*35:0});y-=80+Math.random()*38}}
  function spawnAbove(){let minY=Math.min(...platforms.map(p=>p.y));while(minY>cameraY-900){const gap=78+Math.random()*45+Math.min(28,score*.25),w=Math.max(58,105-score*.11+Math.random()*38),x=20+Math.random()*(W-w-40);minY-=gap;platforms.push({x,y:minY,w,h:12,phase:Math.random()*6.28,move:score>12&&Math.random()<Math.min(.48,.16+score/260)?24+Math.random()*48:0})}platforms=platforms.filter(p=>p.y-cameraY<H+160)}
  function burst(x,y,n=10){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=70+Math.random()*170;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55+Math.random()*.35,max:1,r:2+Math.random()*3})}}
  function update(dt){
    time+=dt;const accel=1750,max=390;if(input.left)player.vx-=accel*dt;if(input.right)player.vx+=accel*dt;if(input.pointer){const target=input.px;player.vx+=Math.sign(target-player.x)*accel*.75*dt}if(!input.left&&!input.right&&!input.pointer)player.vx*=Math.pow(.0008,dt);player.vx=Math.max(-max,Math.min(max,player.vx));
    const prevY=player.y;player.vy+=1550*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;if(player.x<-player.r)player.x=W+player.r;if(player.x>W+player.r)player.x=-player.r;
    for(const p of platforms){p.drawX=p.move?p.x+Math.sin(time*1.7+p.phase)*p.move:p.x}
    if(player.vy>0){const oldBottom=prevY+player.r,newBottom=player.y+player.r;for(const p of platforms){const px=p.drawX??p.x;if(oldBottom<=p.y+2&&newBottom>=p.y&&player.x+player.r>px&&player.x-player.r<px+p.w){player.y=p.y-player.r;player.vy=-(690+Math.min(140,score*2.1));burst(player.x,p.y,9);sfx.bounce();break}}}
    const targetCam=player.y-H*.38;if(targetCam<cameraY)cameraY+=(targetCam-cameraY)*Math.min(1,dt*7.5);
    score=Math.max(score,Math.floor((-cameraY)/95));scoreEl.textContent=score;
    const milestone=Math.floor(score/10)*10;if(milestone>=10&&milestone>lastMilestone){lastMilestone=milestone;sfx.milestone()}
    spawnAbove();for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);if(player.y-cameraY>H+80)endGame()
  }
  function rr(x,y,w,h,r){const m=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+m,y);ctx.arcTo(x+w,y,x+w,y+h,m);ctx.arcTo(x+w,y+h,x,y+h,m);ctx.arcTo(x,y+h,x,y,m);ctx.arcTo(x,y,x+w,y,m);ctx.closePath()}
  function draw(){
    ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d1231');g.addColorStop(.55,'#171943');g.addColorStop(1,'#090b17');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(const s of stars){let sy=(s.y+(-cameraY*.08))%H;if(sy<0)sy+=H;ctx.globalAlpha=s.a*(.7+.3*Math.sin(time*2+s.x));ctx.fillStyle='#dfe8ff';ctx.beginPath();ctx.arc(s.x,sy,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
    const glow=ctx.createRadialGradient(W*.5,H*.2,10,W*.5,H*.2,W*.75);glow.addColorStop(0,'rgba(112,94,255,.13)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    for(const p of platforms){const y=p.y-cameraY;if(y<-30||y>H+30)continue;const x=p.drawX??p.x;ctx.save();ctx.shadowColor='rgba(108,245,255,.38)';ctx.shadowBlur=18;const pg=ctx.createLinearGradient(x,y,x+p.w,y);pg.addColorStop(0,'#66f5ff');pg.addColorStop(.55,'#8b8cff');pg.addColorStop(1,'#ff72c6');ctx.fillStyle=pg;rr(x,y,p.w,p.h,7);ctx.fill();ctx.restore()}
    for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/.9);ctx.fillStyle='#7df7ff';ctx.beginPath();ctx.arc(q.x,q.y-cameraY,q.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
    const py=player.y-cameraY;ctx.save();ctx.shadowColor='#74f6ff';ctx.shadowBlur=28;const bg=ctx.createRadialGradient(player.x-5,py-7,2,player.x,py,player.r*1.3);bg.addColorStop(0,'#ffffff');bg.addColorStop(.25,'#9ff9ff');bg.addColorStop(.68,'#7f86ff');bg.addColorStop(1,'#d35cff');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(player.x,py,player.r,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(player.x-6,py-7,4,0,Math.PI*2);ctx.fill();requestAnimationFrame(loop)
  }
  function loop(ts){const dt=Math.min(.022,(ts-last)/1000||.016);last=ts;if(running)update(dt);draw()}
  function startGame(){ensureAudio();reset();running=true;last=performance.now();startScreen.style.display='none';overScreen.style.display='none';sfx.start()}
  function endGame(){if(!running)return;running=false;const isNew=score>best;if(isNew){best=score;localStorage.setItem('bounceRushBest',best);bestEl.textContent=best}sfx.gameOver();if(isNew)setTimeout(()=>sfx.newBest(),180);finalScoreEl.textContent=score;resultText.textContent=isNew&&score>0?'New best! Keep the rush alive.':'One more bounce?';overScreen.style.display='grid'}
  addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))input.left=true;if(['ArrowRight','d','D'].includes(e.key))input.right=true;if((e.code==='Space'||e.key==='Enter')&&!running)startGame()});
  addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))input.left=false;if(['ArrowRight','d','D'].includes(e.key))input.right=false});
  wrap.addEventListener('pointerdown',e=>{if(e.target===soundBtn)return;input.pointer=true;input.px=e.clientX-wrap.getBoundingClientRect().left});
  wrap.addEventListener('pointermove',e=>{if(input.pointer)input.px=e.clientX-wrap.getBoundingClientRect().left});
  addEventListener('pointerup',()=>input.pointer=false);
  document.getElementById('startBtn').onclick=startGame;document.getElementById('restartBtn').onclick=startGame;addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)input.left=input.right=input.pointer=false});resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
